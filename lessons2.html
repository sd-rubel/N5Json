<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মিন্না নো নিহোঙ্গো লেসন ২ শব্দভাণ্ডার</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1><span class="vocab">মিন্না নো নিহোঙ্গো</span> <span class="n5">N5</span> <span class="lesson">লেসন ২</span> <span class="vocab">শব্দভাণ্ডার</span></h1>
    <div class="table-header">
        <span>নং</span>
        <span>জাপানি</span>
        <span>উচ্চারণ (বাংলা)</span>
        <span>বাংলা অর্থ</span>
    </div>
    <div class="container">
        <table id="vocabTable"></table>
    </div>

    <div id="modal" class="modal">
        <div class="m-content">
            <span class="close-btn">&times;</span>
            <span id="m-emoji" class="emoji"></span>
            <h2 id="m-japanese"></h2>
            <p><strong>উচ্চারণ:</strong> <span id="m-pronunciation"></span></p>
            <p><strong>অর্থ:</strong> <span id="m-meaning"></span></p>
            <p><strong>মন্তব্য:</strong> <span id="m-comment"></span></p>
            <p><strong>বাক্য:</strong> <span id="m-sentence"></span></p>
            <p><strong>উচ্চারণ:</strong> <span id="m-sentence-pronunciation"></span></p>
            <p><strong>অনুবাদ:</strong> <span id="m-translation"></span></p>
        </div>
    </div>

    <script>
        const jsonUrl = "https://raw.githubusercontent.com/YourUsername/YourRepo/main/data/lesson2.json"; // আপনার GitHub রিপোজিটরির URL
        const table = document.getElementById('vocabTable');
        const modal = document.getElementById('modal');
        const closeBtn = document.querySelector('.close-btn');

        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) throw new Error('JSON ফাইল লোড করতে সমস্যা হয়েছে');
                return response.json();
            })
            .then(data => {
                data.vocabulary.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.id}</td>
                        <td data-emoji="${item.emoji}">${item.japanese}</td>
                        <td>${item.pronunciation}</td>
                        <td>${item.meaning}</td>
                    `;
                    row.addEventListener('click', () => {
                        document.getElementById('m-japanese').textContent = item.japanese;
                        document.getElementById('m-pronunciation').textContent = item.pronunciation;
                        document.getElementById('m-meaning').textContent = item.meaning;
                        document.getElementById('m-emoji').textContent = item.emoji;
                        document.getElementById('m-comment').textContent = item.comment;
                        document.getElementById('m-sentence').textContent = item.sentence.jp;
                        document.getElementById('m-sentence-pronunciation').textContent = item.sentence.pronunciation;
                        document.getElementById('m-translation').textContent = item.sentence.bn;
                        modal.style.display = 'flex';
                    });
                    table.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                table.innerHTML = '<tr><td colspan="4">ডেটা লোড করতে ব্যর্থ। দয়া করে পুনরায় চেষ্টা করুন।</td></tr>';
            });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
  </html>
